<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MEGAFON HABER — Yayın Kontrol Masası</title>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #14171f;
    --panel-hover: #1b202b;
    --border: #252b3b;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --red: #dc2626;
    --green: #059669;
    --amber: #d97706;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    line-height: 1.5;
  }
  .container { max-width: 1180px; margin: 0 auto; }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: 0.4px; color: #fff; }
  .brand span { color: var(--red); font-weight: 700; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--panel-hover); border-color: #3b445e; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { opacity: 0.9; }
  .btn.green { background: #064e3b; border-color: #047857; color: #ecfdf5; }
  .btn.amber { background: #78350f; border-color: #b45309; color: #fef3c7; }
  .btn.danger { background: #450a0a; border-color: #991b1b; color: #fecaca; }

  /* Canlı Haber Merkezi Admin Durum Çubuğu */
  .telemetry-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .t-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .t-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .t-val { font-size: 14px; font-weight: 700; color: #fff; margin-top: 3px; }
  .t-val.live { color: #34d399; }
  .t-val.working { color: #fbbf24; }

  /* Arama ve durum çubuğu */
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .search-input {
    flex: 1;
    min-width: 220px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  .status-filter {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
  }

  /* Emojisiz Kategori Sekmeleri */
  .tabs-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    scrollbar-width: thin;
  }
  .tab-btn {
    white-space: nowrap;
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #fff;
    color: #0c0e12;
    border-color: #fff;
  }
  .tab-count {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    opacity: 0.75;
  }

  /* Haber Kartları */
  .cards-list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge {
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .badge.queued { background: #78350f; color: #fef3c7; }
  .badge.published { background: #064e3b; color: #d1fae5; }
  .badge.rejected { background: #3f1d24; color: #fca5a5; }
  .badge.cat { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
  .badge.src { background: #18181b; color: #a1a1aa; }

  .tweet-box {
    font-size: 15px;
    color: #f9fafb;
    white-space: pre-line;
    margin-bottom: 12px;
    padding: 12px;
    background: rgba(0,0,0,0.25);
    border-left: 3px solid #4b5563;
    border-radius: 6px;
  }
  .card.is-queued .tweet-box { border-left-color: var(--amber); }
  .card.is-published .tweet-box { border-left-color: var(--green); }
  .card.is-rejected .tweet-box { border-left-color: var(--red); color: #9ca3af; font-size: 13.5px; }

  .reason-box {
    font-size: 12.5px;
    color: #f87171;
    margin-bottom: 10px;
  }
  .media-box img {
    max-width: 100%;
    max-height: 240px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .card-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .orig-link {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    max-width: 65%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .orig-link:hover { color: #fff; text-decoration: underline; }
  .action-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111827;
    color: #fff;
    border: 1px solid #374151;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    z-index: 999;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  @media (max-width: 640px) {
    body { padding: 10px; }
    .brand { font-size: 17px; }
    .orig-link { max-width: 100%; white-space: normal; }
  }
</style>
</head>

const GITHUB_REPO = "etkibolatcan/megafon-haber-bot";
let activeTab = "tumu";

function showToast(msg) {
  const el = document.getElementById("toastBox");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 3500);
}

function getToken() {
  let t = localStorage.getItem("megafon_gh_token") || "";
  if (!t && window.location.hash.startsWith("#token=")) {
    t = decodeURIComponent(window.location.hash.replace("#token=", "").trim());
    localStorage.setItem("megafon_gh_token", t);
    history.replaceState(null, "", window.location.pathname);
  }
  return t;
}

function configureCloudToken() {
  const cur = getToken();
  const val = prompt("Telefon veya uzaktan kontrol için GitHub bağlantınızı (ghp_...) girin (bir kez girmeniz yeterlidir):", cur);
  if (val !== null) {
    localStorage.setItem("megafon_gh_token", val.trim());
    showToast("Bulut kontrol anahtarı kaydedildi.");
  }
}

async function runQueueAction(action, id, currentTweet) {
  let text = "";
  if (action === "edit") {
    const edited = prompt("Yeni tweet metnini girin (en fazla 280 karakter):", currentTweet || "");
    if (edited === null) return;
    text = edited;
  } else if (action === "enqueue" && (!currentTweet || currentTweet.length < 15)) {
    const edited = prompt("Bu elenen haber için paylaşılacak tweet metnini girin:", currentTweet || "");
    if (edited === null) return;
    text = edited;
  }

  // 1) Eğer yerel sunucudaysak (localhost) doğrudan anında uygula
  if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
    const resp = await fetch("/api/action", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action, id, text})
    });
    const res = await resp.json();
    showToast(res.message || "İşlem tamamlandı.");
    setTimeout(() => window.location.reload(), 600);
    return;
  }

  // 2) Uzaktan (Telefondan / GitHub Pages) bağlanıyorsak GitHub API üzerinden tetikle
  const token = getToken();
  if (!token) {
    configureCloudToken();
    return;
  }
  showToast("Komut buluta gönderiliyor...");
  const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/megafon.yml/dispatches`, {
    method: "POST",
    headers: {
      "Authorization": `token ${token}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      ref: "main",
      inputs: {
        queue_action: action,
        article_id: String(id),
        custom_text: text
      }
    })
  });
  if (resp.status === 204) {
    showToast("Komut buluta iletildi! ~30 sn içinde veritabanı ve panel güncellenecek.");
  } else {
    showToast("Hata oluştu (HTTP " + resp.status + "). Anahtarınızı kontrol edin.");
  }
}

async function refreshFromCloud() {
  if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
    showToast("Buluttaki son durum çekiliyor...");
    await fetch("/api/action", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: "sync_pull", id: 0, text: ""})
    });
    window.location.reload();
  } else {
    window.location.href = window.location.pathname + "?t=" + Date.now();
  }
}

async function triggerCloudRun() {
  if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
    const resp = await fetch("/api/action", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: "trigger_cloud", id: 0, text: ""})
    });
    const res = await resp.json();
    showToast(res.message || "Bulut döngüsü başlatıldı.");
    return;
  }
  const token = getToken();
  if (!token) {
    configureCloudToken();
    return;
  }
  const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/megafon.yml/dispatches`, {
    method: "POST",
    headers: {
      "Authorization": `token ${token}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ref: "main"})
  });
  if (resp.status === 204) {
    showToast("Bulut döngüsü başlatıldı!");
  } else {
    showToast("Tetikleme hatası: HTTP " + resp.status);
  }
}

function renderTabs() {
  const bar = document.getElementById("tabsBar");
  bar.innerHTML = TABS.map(t => `
    <button class="tab-btn ${t.key === activeTab ? 'active' : ''}" onclick="selectTab('${t.key}')">
      ${t.label}<span class="tab-count">(${t.count})</span>
    </button>
  `).join("");
}

function selectTab(key) {
  activeTab = key;
  renderTabs();
  renderList();
}

function escapeHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderList() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
  const st = document.getElementById("statusFilter").value;
  const listEl = document.getElementById("cardsList");

  const filtered = ITEMS.filter(item => {
    if (!item.tabs.includes(activeTab)) return false;
    if (st !== "all") {
      if (st === "queued" && item.status !== "queued" && item.status !== "preview") return false;
      if (st === "published" && item.status !== "published") return false;
      if (st === "rejected" && item.status !== "rejected") return false;
    }
    if (q) {
      const hay = (item.title + " " + item.tweet + " " + item.source_name + " " + item.category + " " + item.reason).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (!filtered.length) {
    listEl.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);">Bu pencerede eşleşen haber bulunmuyor.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(item => {
    const isQueued = item.status === "queued" || item.status === "preview";
    const isPub = item.status === "published";
    const isRej = item.status === "rejected";

    const stLabel = isQueued ? "KUYRUKTA HAZIR" : (isPub ? "X'TE YAYINLANDI" : "ELENDİ");
    const stClass = isQueued ? "queued" : (isPub ? "published" : "rejected");
    const cardClass = isQueued ? "is-queued" : (isPub ? "is-published" : "is-rejected");

    const bodyTxt = item.tweet ? escapeHtml(item.tweet) : escapeHtml(item.title);
    const reasonHtml = (isRej && item.reason) ? `<div class="reason-box">Eleme Gerekçesi: ${escapeHtml(item.reason)}</div>` : "";
    const mediaHtml = (item.media_url && !isRej) ? `<div class="media-box"><img src="${escapeHtml(item.media_url)}" loading="lazy" alt="Haber Görseli"></div>` : "";

    let actionsHtml = "";
    const safeTweet = JSON.stringify(item.tweet || item.title);
    if (isQueued) {
      actionsHtml = `
        <button class="btn green" onclick='runQueueAction("promote", ${item.id}, ${safeTweet})'>İlk Sıraya Al</button>
        <button class="btn" onclick='runQueueAction("demote", ${item.id}, ${safeTweet})'>Sona Kaydır</button>
        <button class="btn" onclick='runQueueAction("edit", ${item.id}, ${safeTweet})'>Metni Düzenle</button>
        <button class="btn danger" onclick='runQueueAction("remove", ${item.id}, ${safeTweet})'>Kuyruktan Çıkar</button>
      `;
    } else if (isRej) {
      actionsHtml = `
        <button class="btn amber" onclick='runQueueAction("enqueue", ${item.id}, ${safeTweet})'>Kuyruğa Ekle</button>
      `;
    }

    return `
      <div class="card ${cardClass}">
        <div class="card-head">
          <div class="badges">
            <span class="badge ${stClass}">${stLabel}</span>
            <span class="badge cat">${escapeHtml(item.category)}</span>
            <span class="badge src">${escapeHtml(item.source_name)}</span>
          </div>
          <span>#${item.id} • ${escapeHtml(item.time)}</span>
        </div>
        <div class="tweet-box">${bodyTxt}</div>
        ${reasonHtml}
        ${mediaHtml}
        <div class="card-foot">
          <a class="orig-link" href="${escapeHtml(item.url)}" target="_blank">Kaynak: ${escapeHtml(item.title)}</a>
          <div class="action-group">${actionsHtml}</div>
        </div>
      </div>
    `;
  }).join("");
}

function updateSummaryTelemetry(updatedAt) {
  const qCnt = ITEMS.filter(i => i.status === "queued" || i.status === "preview").length;
  const pCnt = ITEMS.filter(i => i.status === "published").length;
  const rCnt = ITEMS.filter(i => i.status === "rejected").length;
  const el = document.getElementById("telCounts");
  if (el) el.textContent = `${qCnt} Kuyrukta • ${pCnt} Yayında • ${rCnt} Elendi`;
  if (updatedAt) {
    const lc = document.getElementById("telLastCycle");
    if (lc) lc.textContent = updatedAt;
    const sh = document.getElementById("subHeader");
    if (sh) sh.textContent = `Canlı Bağlantı Aktif (Son veri: ${updatedAt}) • Sokaktan... (@MegafonBilgi)`;
  }
}

async function fetchLiveFromGitHub(manual = false) {
  try {
    // 1) Eğer localhost ise yerel /api/live_data uç noktasından sıfır gecikmeyle çek
    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
      const r = await fetch("/api/live_data?t=" + Date.now(), {cache: "no-store"});
      if (r.ok) {
        const d = await r.json();
        TABS = d.tabs;
        ITEMS = d.items;
         renderTabs();
        renderList();
        updateSummaryTelemetry(d.updated_at);
        if (manual) showToast("Veriler güncellendi.");
      }
    } else {
      // 2) Mobil / Uzaktan erişimde CDN önbelleğini atlayıp doğrudan GitHub API'sinden anlık live_data.json çek
      const r = await fetch(`https://api.github.com/repos/etkibolatcan/megafon-masa/contents/live_data.json?t=${Date.now()}`, {
        headers: {"Accept": "application/vnd.github.raw+json"},
        cache: "no-store"
      });
      if (r.ok) {
        const d = await r.json();
        TABS = d.tabs;
        ITEMS = d.items;
        renderTabs();
        renderList();
        updateSummaryTelemetry(d.updated_at);
        if (manual) showToast("Canlı bulut verisi çekildi!");
      }
    }

    // 3) GitHub Actions canlı çalışma durumunu kontrol et
    const token = getToken();
    if (token) {
      const rr = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/actions/runs?per_page=1&t=${Date.now()}`, {
        headers: {"Authorization": `token ${token}`, "Accept": "application/vnd.github+json"},
        cache: "no-store"
      });
      if (rr.ok) {
        const rdata = await rr.json();
        const run = (rdata.workflow_runs || [])[0];
        const stEl = document.getElementById("telRunStatus");
        if (run && stEl) {
          if (run.status === "in_progress" || run.status === "queued" || run.status === "pending") {
            stEl.className = "t-val working";
            stEl.textContent = "Şu An Tarama & Paylaşım Yapıyor...";
          } else {
            const dt = new Date(run.updated_at).toLocaleTimeString("tr-TR", {hour: "2-digit", minute: "2-digit"});
            stEl.className = "t-val live";
            stEl.textContent = `Hazır (Son çalışma: ${dt})`;
          }
        }
      }
    } else {
      const stEl = document.getElementById("telRunStatus");
      if (stEl) { stEl.className = "t-val live"; stEl.textContent = "Aktif (20 dk'da bir otomatik)"; }
    }
  } catch (e) {
    console.warn("Canlı veri kontrol hatası:", e);
  }
}

getToken();
renderTabs();
renderList();
updateSummaryTelemetry("14.11.2026 15:40:57");
fetchLiveFromGitHub(false);
setInterval(() => fetchLiveFromGitHub(false), 15000);
</script>
